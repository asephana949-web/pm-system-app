<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Work Order{% endblock %} - PM System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --ink: #1d2733; --muted: #65727f; --paper: #f3f5f6; --surface: #ffffff; --line: #d9dfe4;
            --accent: #0b6e6e; --accent-dark: #085454; --accent-soft: #e2f1f0;
        }
        body { font-family: 'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif; background: var(--paper); color: var(--ink); font-variant-numeric: tabular-nums; }
        .wo-nav { background: var(--ink); color: #fff; }
        .wo-nav .brand { font-weight: 600; font-size: 1.05rem; letter-spacing: .2px; }
        .wo-nav a.tab { color: #b8c2cc; text-decoration: none; padding: .85rem 1rem; display: inline-block; border-bottom: 3px solid transparent; font-size: .95rem; }
        .wo-nav a.tab:hover { color: #fff; }
        .wo-nav a.tab.active { color: #fff; border-bottom-color: #4fc3c3; }
        .wo-nav .who { color: #b8c2cc; font-size: .85rem; }
        .wo-nav .who a { color: #fff; }
        .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; }
        .panel-head { padding: .75rem 1rem; border-bottom: 1px solid var(--line); font-weight: 600; }
        .panel-body { padding: 1rem; }
        h1.page-title { font-size: 1.35rem; font-weight: 600; margin: 0; }
        .muted { color: var(--muted); }
        .btn-accent { background: var(--accent); border-color: var(--accent); color: #fff; }
        .btn-accent:hover, .btn-accent:focus { background: var(--accent-dark); border-color: var(--accent-dark); color: #fff; }
        .form-control:focus, .form-select:focus { border-color: var(--accent); box-shadow: 0 0 0 .2rem rgba(11,110,110,.18); }
        .btn:focus-visible, a:focus-visible { outline: 3px solid #4fc3c3; outline-offset: 2px; }
        /* Badge status */
        .st { display: inline-block; padding: .15rem .55rem; border-radius: 4px; font-size: .78rem; font-weight: 500; white-space: nowrap; }
        .st-Baru { background: #e8edf2; color: #33475b; }
        .st-Diterima { background: #dfeaf8; color: #1d4f91; }
        .st-Antri { background: #fdf0d5; color: #7a5200; }
        .st-Dikerjakan { background: #d3efe0; color: #0f5d34; }
        .st-Menunggu { background: #fde4d3; color: #8a3c00; }
        .st-Selesai { background: #e3e7ea; color: #4a5560; }
        .st-Dibatalkan { background: #eceded; color: #8a8f94; }
        /* Prioritas */
        .pr { white-space: nowrap; font-size: .88rem; }
        .pr::before { content: ''; display: inline-block; width: .6rem; height: .6rem; border-radius: 50%; margin-right: .4rem; background: var(--dot, #9aa5b0); }
        .pr-Darurat { --dot: #c62828; font-weight: 600; }
        .pr-Tinggi { --dot: #ef8a17; }
        .pr-Normal { --dot: #7b8794; }
        .pr-Rendah { --dot: #c5ccd3; }
        .flag-telat { color: #b3261e; font-size: .8rem; font-weight: 600; }
        @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
    </style>
    {% block head %}{% endblock %}
</head>
<body>
<header class="wo-nav">
    <div class="container-xl d-flex flex-wrap align-items-center justify-content-between">
        <div class="d-flex flex-wrap align-items-center">
            <span class="brand me-3 py-2"><i class="fa-solid fa-clipboard-list me-2"></i>Work Order Teknik</span>
            <nav>
                <a class="tab {% if active == 'dashboard' %}active{% endif %}" href="{{ url_for('wo_dashboard') }}">Dashboard WO</a>
                <a class="tab {% if active == 'daftar' %}active{% endif %}" href="{{ url_for('wo_daftar') }}">{% if is_pemohon %}WO saya{% else %}Daftar WO{% endif %}</a>
                <a class="tab {% if active == 'baru' %}active{% endif %}" href="{{ url_for('wo_baru') }}">Buat WO</a>
            </nav>
        </div>
        <div class="who py-2">
            {% if not is_pemohon %}<a href="{{ url_for('dashboard') }}" class="me-3"><i class="fa-solid fa-gears me-1"></i>Aplikasi PM</a>{% endif %}
            <i class="fa-regular fa-user me-1"></i>{{ username }}
            <a href="{{ url_for('logout') }}" class="ms-3">Keluar</a>
        </div>
    </div>
</header>

<main class="container-xl py-4">
    {% block content %}{% endblock %}
</main>

<div class="toast-container position-fixed bottom-0 end-0 p-3">
    <div id="woToast" class="toast align-items-center text-bg-dark border-0" role="status" aria-live="polite">
        <div class="d-flex"><div class="toast-body" id="woToastBody"></div>
        <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Tutup"></button></div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
const WO = {
    username: {{ username|tojson }},
    canManage: {{ can_manage|tojson }},
    isPemohon: {{ is_pemohon|tojson }},
    seksi: {{ seksi_list|tojson }},
    status: {{ status_list|tojson }},
    prioritas: {{ prioritas_list|tojson }},
    aktif: {{ status_aktif|tojson }}
};
const BULAN = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];

function esc(s) {
    return String(s === null || s === undefined ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function fmtTgl(s) {
    if (!s) return '-';
    const [tgl, jam] = String(s).split(' ');
    const p = tgl.split('-');
    if (p.length !== 3) return esc(s);
    return `${+p[2]} ${BULAN[+p[1]-1]} ${p[0]}` + (jam ? ` ${jam}` : '');
}
function badgeStatus(s) { return `<span class="st st-${esc(s)}">${esc(s)}</span>`; }
function badgePrioritas(p) { return `<span class="pr pr-${esc(p)}">${esc(p)}</span>`; }

// Aman terhadap respons HTML (mis. halaman error server) agar tidak muncul "Unexpected token '<'"
async function woFetch(url, opts) {
    const res = await fetch(url, opts);
    const tipe = res.headers.get('content-type') || '';
    if (!tipe.includes('application/json')) {
        if (res.redirected || res.status === 401) { location.href = '/login'; }
        throw new Error('Server mengirim respons yang tidak dikenali (kode ' + res.status + ').');
    }
    const data = await res.json();
    if (!res.ok || data.status === 'error') throw new Error(data.message || data.error || 'Terjadi kesalahan.');
    return data;
}
function woKirim(url, metode, body) {
    return woFetch(url, { method: metode, headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body) });
}
function woToast(pesan, galat) {
    const el = document.getElementById('woToast');
    el.className = 'toast align-items-center border-0 ' + (galat ? 'text-bg-danger' : 'text-bg-dark');
    document.getElementById('woToastBody').textContent = pesan;
    bootstrap.Toast.getOrCreateInstance(el, { delay: galat ? 6000 : 3500 }).show();
}
</script>
{% block scripts %}{% endblock %}
</body>
</html>
